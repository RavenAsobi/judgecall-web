limit_req_zone $binary_remote_addr zone=lynx_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=lynx_api:10m rate=120r/m;

server {
    listen 80;
    listen [::]:80;
    server_name index.judgecall.net lynx.judgecall.net;

    return 301 https://$host$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name judgecall.net www.judgecall.net;

    return 301 https://index.judgecall.net$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name index.judgecall.net;

    ssl_certificate /etc/nginx/ssl/index.judgecall.net/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/index.judgecall.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /var/www/judgecall/current;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / { try_files $uri $uri/ /index.html; }
    location ~ /\. { deny all; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name judgecall.net www.judgecall.net;

    ssl_certificate /etc/nginx/ssl/judgecall.net/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/judgecall.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    return 301 https://index.judgecall.net$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name lynx.judgecall.net;

    ssl_certificate /etc/nginx/ssl/lynx.judgecall.net/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/lynx.judgecall.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /var/www/lynx/current/web/dist;
    index lynx-beta.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = / { try_files /lynx-beta.html =404; }
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location /ws {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
    location = /api/auth/login {
        limit_req zone=lynx_login burst=3 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }
    location /api/ {
        limit_req zone=lynx_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }
    location / { try_files $uri $uri/ /lynx-beta.html; }
    location ~ /\. { deny all; }
}
