# Temporary HTTP-only public configuration. Replace with the HTTPS configuration
# when certificate deployment is explicitly authorized.
limit_req_zone $binary_remote_addr zone=lynx_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=lynx_api:10m rate=120r/m;

server {
    listen 80;
    listen [::]:80;
    server_name index.judgecall.net judgecall.net www.judgecall.net;

    root /var/www/judgecall/current;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / { try_files $uri $uri/ /index.html; }
    location ~ /\. { deny all; }
}

server {
    listen 80;
    listen [::]:80;
    server_name lynx.judgecall.net;

    root /var/www/lynx/current/web/dist;
    index lynx-beta.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = / { try_files /lynx-beta.html =404; }
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location /ws {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
    location = /api/auth/login {
        limit_req zone=lynx_login burst=3 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }
    location /api/ {
        limit_req zone=lynx_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }
    location / { try_files $uri $uri/ /lynx-beta.html; }
    location ~ /\. { deny all; }
}
