# ICP approval is not complete. Keep both sites bound to loopback only.
limit_req_zone $binary_remote_addr zone=lynx_private_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=lynx_private_api:10m rate=120r/m;

server {
    listen 127.0.0.1:8080 default_server;
    server_name _;
    root /var/www/judgecall/current;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
    location ~ /\. {
        deny all;
    }
}

server {
    listen 127.0.0.1:8081;
    server_name _;
    root /var/www/lynx/current/web/dist;
    index lynx-beta.html;

    location = / {
        try_files /lynx-beta.html =404;
    }
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location /ws {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
    location = /api/auth/login {
        limit_req zone=lynx_private_login burst=3 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }
    location /api/ {
        limit_req zone=lynx_private_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }
    location / {
        try_files $uri $uri/ /lynx-beta.html;
    }
    location ~ /\. {
        deny all;
    }
}