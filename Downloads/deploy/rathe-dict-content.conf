location = /rathe-dict/stable/manifest.json {
    alias /var/www/download/shared/rathe-dict/stable/manifest.json;
    default_type application/json;
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
}
location ^~ /rathe-dict/packages/ {
    alias /var/www/download/shared/rathe-dict/packages/;
    autoindex off;
    default_type application/octet-stream;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}
location ^~ /rathe-dict/app/ {
    alias /var/www/download/shared/rathe-dict/app/;
    autoindex off;
    default_type application/vnd.android.package-archive;
    add_header Content-Disposition "attachment" always;
}
location ^~ /rathe-dict/ { return 404; }
