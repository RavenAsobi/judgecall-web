# Include inside the HTTPS server block for download.judgecall.net.
# Persistent files live outside /var/www/download/current.
location = /judgecall-data/stable/manifest.json {
    alias /var/www/download/shared/judgecall-data/stable/manifest.json;
    default_type application/json;
    add_header Cache-Control "no-cache, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
}

location ^~ /judgecall-data/packages/ {
    alias /var/www/download/shared/judgecall-data/packages/;
    default_type application/zip;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    autoindex off;
}

# Missing metadata must return 404, never the website's HTML fallback.
location ^~ /judgecall-data/ { return 404; }
