limit_req_zone $binary_remote_addr zone=download_hits:10m rate=30r/m;

server {
    listen 80;
    listen [::]:80;
    server_name download.judgecall.net;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://download.judgecall.net$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name download.judgecall.net;

    ssl_certificate /etc/nginx/ssl/download.judgecall.net/download.judgecall.net_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/download.judgecall.net/download.judgecall.net.key;

    root /var/www/download/current;
    index index.html;
    client_max_body_size 1m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    include /etc/nginx/snippets/judgecall-content-updates.conf;
    include /etc/nginx/snippets/rathe-dict-content.conf;

    location = /api/counts {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Cache-Control "no-store" always;
    }

    location /download/ {
        limit_req zone=download_hits burst=10 nodelay;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /files/ {
        types {
            application/vnd.android.package-archive apk;
            application/vnd.rar rar;
        }
        default_type application/octet-stream;
        add_header Content-Disposition "attachment" always;
        try_files $uri =404;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }

    location ~ ^/(server|deploy)/ {
        deny all;
    }

    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}