server {
    listen 80;
    listen [::]:80;
    server_name sep.judgecall.net;
    return 301 https://sep.judgecall.net$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name sep.judgecall.net;

    ssl_certificate /etc/nginx/ssl/sep.judgecall.net/sep.judgecall.net_bundle.crt;
    ssl_certificate_key /etc/nginx/ssl/sep.judgecall.net/sep.judgecall.net.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    location = /sep { return 302 /; }
    location = /sep/ { return 302 /; }
    location / {
        client_max_body_size 1m;
        proxy_pass http://127.0.0.1:3104;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-SEP-Client $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 20s;
    }
}
